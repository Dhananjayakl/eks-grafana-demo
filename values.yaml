# kube-prometheus-stack Helm values
# Install: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f values.yaml

prometheus:
  prometheusSpec:
    # Scrape all namespaces including dev and prod
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    ruleNamespaceSelector: {}

    # Expose Prometheus externally so EC2 Grafana can reach it
    # Replace with your actual EKS LoadBalancer or use NodePort
    externalUrl: ""

    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Additional scrape configs to pick up pods with prometheus.io annotations
    additionalScrapeConfigs:
      - job_name: "kubernetes-pods-dev"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [dev]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_environment]
            target_label: environment

      - job_name: "kubernetes-pods-prod"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [prod]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_environment]
            target_label: environment

  service:
    type: LoadBalancer   # Change to NodePort if you prefer
    port: 9090

# Node Exporter — runs as DaemonSet on every node
nodeExporter:
  enabled: true

# Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# Grafana is disabled here — we use the standalone Grafana on EC2
grafana:
  enabled: false

# kube-state-metrics for pod/deployment level metrics
kubeStateMetrics:
  enabled: true
